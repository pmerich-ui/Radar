name: DealRadar Quality Gate
on:
  push:
    paths:
      - 'src/**'
      - 'tests/test_v5_*.py'
      - 'tests/test_marketing_studio.py'
      - 'tests/test_production_ledger.py'
      - 'tests/test_revenue_quality.py'
      - 'daily_report.py'
      - 'tests/test_daily_report.py'
      - '.github/workflows/quality-gate.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run revenue and reporting unit tests
        run: |
          python -m unittest discover -s tests -p 'test_revenue_quality.py' -v
          python -m unittest discover -s tests -p 'test_daily_report.py' -v
      - name: Run V5 production safety regression tests
        run: python -m unittest discover -s tests -p 'test_v5_*.py' -v
      - name: Run media QA regression tests
        run: python -m unittest discover -s tests -p 'test_marketing_studio.py' -v
      - name: Run durable production ledger tests
        run: python -m unittest discover -s tests -p 'test_production_ledger.py' -v
      - name: Check Python syntax
        run: python -m compileall -q src tests daily_report.py
