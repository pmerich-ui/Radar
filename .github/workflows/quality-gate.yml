name: DealRadar Quality Gate
on:
  push:
    paths:
      - 'src/revenue_quality.py'
      - 'tests/test_revenue_quality.py'
      - 'daily_report.py'
      - 'tests/test_daily_report.py'
      - '.github/workflows/quality-gate.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run revenue and reporting unit tests
        run: |
          python -m unittest discover -s tests -p 'test_revenue_quality.py' -v
          python -m unittest discover -s tests -p 'test_daily_report.py' -v
      - name: Install video test dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Run video regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*video*.py' -v
      - name: Check Python syntax
        run: python -m compileall -q src/revenue_quality.py daily_report.py
