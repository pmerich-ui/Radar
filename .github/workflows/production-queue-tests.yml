name: Production queue safety tests
on:
  pull_request:
    paths:
      - 'src/production_queue.py'
      - 'tests/test_production_queue.py'
      - '.github/workflows/production-queue-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated SQLite queue regression tests
        run: python3 -m unittest discover -s tests -p 'test_production_queue.py' -v
