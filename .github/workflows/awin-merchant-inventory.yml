name: Awin joined merchant inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merchant-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read joined merchant names and available programme metadata
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          from pathlib import Path
          token = os.getenv("AWIN_API_TOKEN", "").strip()
          if not token:
              print("BLOCKED: AWIN_API_TOKEN_MISSING")
              sys.exit(1)
          def read(url):
              req = urllib.request.Request(url, method="GET", headers={
                  "Authorization": "Bearer " + token, "Accept": "application/json",
                  "User-Agent": "DealRadar-MerchantInventory/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  print("BLOCKED: AWIN_HTTP_" + str(exc.code))
                  sys.exit(1)
              except Exception as exc:
                  print("BLOCKED: AWIN_REQUEST_" + type(exc).__name__)
                  sys.exit(1)
          accounts = read("https://api.awin.com/accounts?type=publisher")
          accounts = accounts.get("accounts", []) if isinstance(accounts, dict) else accounts
          publishers = [a for a in accounts if isinstance(a, dict)
                        and a.get("accountType") == "publisher"
                        and str(a.get("accountId", "")).isdigit()] if isinstance(accounts, list) else []
          if len(publishers) != 1:
              print("BLOCKED: EXPECTED_ONE_PUBLISHER")
              sys.exit(1)
          pid = str(publishers[0]["accountId"])
          response = read("https://api.awin.com/publishers/" + pid + "/programmes?relationship=joined")
          programmes = response if isinstance(response, list) else response.get("programmes") if isinstance(response, dict) else None
          if not isinstance(programmes, list) or not all(isinstance(p, dict) for p in programmes):
              print("BLOCKED: UNEXPECTED_PROGRAMMES_RESPONSE")
              sys.exit(1)
          def clean(value):
              return re.sub(r"[\\r\\n\\t|<>]", " ", str(value or "")).strip()[:110]
          def first(p, keys):
              for k in keys:
                  v = p.get(k)
                  if isinstance(v, (str, int, float)) and str(v).strip():
                      return clean(v)
              return "nicht angegeben"
          rows = []
          for p in programmes:
              name = first(p, ("advertiserName", "programmeName", "programName", "name"))
              region = first(p, ("primaryRegion", "region", "country", "countryCode"))
              # Metadata is descriptive, not proof of Swiss shipping or commission.
              commission = first(p, ("commissionRange", "commission", "commissionRate"))
              rows.append((name, region, commission))
          rows.sort(key=lambda r:r[0].casefold())
          lines = ["## Awin joined Händlerprogramme", "",
                   "Abgerufene Programme: **" + str(len(rows)) + "**", "",
                   "| Händlername | Region (API) | Provision (API) |",
                   "|---|---|---|"]
          for name, region, commission in rows:
              lines.append("| " + name + " | " + region + " | " + commission + " |")
          lines += ["", "**Nicht verifiziert:** Schweizer Versand, reale Provisionsbedingungen, Produktfeed-Zugang, Produktpreise und Affiliate-Links.",
                    "", "Keine Veröffentlichung oder Änderung bei Awin."]
          summary = os.getenv("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("\n".join(lines) + "\n")
          print("AWIN_MERCHANT_INVENTORY_OK; joined programmes:", len(rows))
          print("Merchant names and available metadata are in the job summary (not secret values).")
          print("SWISS_SHIPPING_NOT_VERIFIED; PRODUCT_LINKS_NOT_VERIFIED; COMMISSIONS_NOT_VERIFIED")
          PY
