name: DealRadar Queue Safety Regression
on:
  workflow_dispatch:
  push:
    branches:
      - fix/video-queue-atomic-20261123
    paths:
      - 'src/video_job_queue.py'
      - 'tests/test_video_job_queue.py'
      - '.github/workflows/video-queue-safety.yml'
permissions:
  contents: read
concurrency:
  group: dealradar-queue-safety-${{ github.ref }}
  cancel-in-progress: false
jobs:
  queue-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute SQLite queue regression tests
        run: python -m unittest discover -s tests -p 'test_video_job_queue.py' -v
