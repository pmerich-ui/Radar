name: DealRadar Metricool MCP Release Tests
on:
  pull_request:
    paths:
      - "src/metricool_mcp_bridge.py"
      - "tests/test_metricool_mcp_bridge.py"
      - ".github/workflows/metricool-mcp-release-test.yml"
  push:
    paths:
      - "src/metricool_mcp_bridge.py"
      - "tests/test_metricool_mcp_bridge.py"
      - ".github/workflows/metricool-mcp-release-test.yml"
jobs:
  metricool-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile publisher and QA module
        run: python -m compileall -q src/metricool_mcp_bridge.py src/media_recovery_v8.py
      - name: Run end-to-end handoff regression suite
        run: python -m unittest discover -s tests -p 'test_metricool_mcp_bridge.py' -v
