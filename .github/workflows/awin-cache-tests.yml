name: Awin Cache Security
on:
  push:
    branches: [fix/awin-encrypted-cache-20261124]
  pull_request:
    paths:
      - 'src/awin_sources.py'
      - 'tests/test_awin_sources.py'
      - 'requirements.txt'
      - '.github/workflows/awin-cache-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_awin_sources.py -q
