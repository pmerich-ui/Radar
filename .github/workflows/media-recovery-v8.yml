name: DealRadar V8 Media Recovery
on:
  pull_request:
    paths:
      - 'src/media_recovery_v8.py'
      - 'tests/test_media_recovery_v8.py'
      - 'config/media_recovery_v8.json'
      - '.github/workflows/media-recovery-v8.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 8,12,16,20 * * *'
permissions:
  contents: read
concurrency:
  group: dealradar-media-recovery-v8
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Regression checks
        run: python -m unittest discover -s tests -p test_media_recovery_v8.py -v
      - name: Recover real videos (no publication)
        if: github.event_name != 'pull_request'
        run: python -m src.media_recovery_v8
      - name: Store QA report without private media
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: recovery-report-${{ github.run_id }}
          path: recovery-output/report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve review media only in private repository
        if: github.event_name != 'pull_request' && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: recovery-media-${{ github.run_id }}
          path: |
            recovery-output/*.mp4
            recovery-output/*-review.jpg
          if-no-files-found: warn
          retention-days: 3
