name: DealRadar Agent Task Queue
on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent ID 01-38'
        required: true
        type: string
      task_id:
        description: 'Unique task ID (letters, digits, hyphen, underscore)'
        required: true
        type: string
      description:
        description: 'Task description; no secrets'
        required: true
        type: string
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: dealradar-agent-queue
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: 'true'
      PUBLISHING_ENABLED: 'false'
      MODE: GROWTH
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run queue tests
        run: python -m unittest discover -s tests -p 'test_agent_queue.py' -v
      - name: Enqueue manually approved task
        if: github.event_name == 'workflow_dispatch'
        env:
          TASK_AGENT: ${{ inputs.agent }}
          TASK_ID: ${{ inputs.task_id }}
          TASK_DESCRIPTION: ${{ inputs.description }}
        run: python -m src.agent_queue enqueue --agent "$TASK_AGENT" --task-id "$TASK_ID" --description "$TASK_DESCRIPTION"
      - name: Process pending tasks (no external side effects)
        run: python -m src.agent_queue work
      - name: Commit task receipts
        run: |
          git config user.name 'dealradar-agent-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add queue/pending queue/results
          if ! git diff --cached --quiet; then
            git commit -m 'Record DealRadar task queue receipts'
            git push
          fi
