name: DealRadar V5 MP4 preflight (no publishing)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/free-video-fallback-router-20261111
    paths:
      - scripts/video_preflight.py
      - scripts/publication_gate.py
      - scripts/test_publication_gate.py
      - scripts/analytics_24h.py
      - scripts/test_analytics_24h.py
      - tests/test_video_preflight.py
      - .github/workflows/video-preflight.yml
jobs:
  test-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests with real synthetic MP4 and invalid inputs
        run: python3 tests/test_video_preflight.py
      - name: Publication safety and idempotency regression tests
        run: python3 scripts/test_publication_gate.py
      - name: Persistent 24-hour analytics regression tests
        run: python3 scripts/test_analytics_24h.py
      - name: Verify inspection evidence exists and is valid JSON
        if: success()
        run: |
          test -s qa-output/preflight.json
          python3 -m json.tool qa-output/preflight.json > /dev/null
      - name: Save inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealradar-preflight-evidence
          path: qa-output/preflight.json
          if-no-files-found: error
          retention-days: 7
