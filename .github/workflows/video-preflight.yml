name: DealRadar V5 MP4 preflight (no publishing)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/free-video-fallback-router-20261111
    paths:
      - scripts/video_preflight.py
      - tests/test_video_preflight.py
      - .github/workflows/video-preflight.yml
jobs:
  test-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests with real synthetic MP4 and invalid inputs
        run: python3 tests/test_video_preflight.py
      - name: Save inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealradar-preflight-evidence
          path: qa-output/preflight.json
          if-no-files-found: warn
          retention-days: 7
