name: DealRadar V5 MP4 preflight (no publishing)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/free-video-fallback-router-20261111
    paths:
      - scripts/video_preflight.py
      - scripts/perchance_manual_handoff.py
      - tests/test_perchance_handoff.py
      - scripts/publication_gate.py
      - scripts/test_publication_gate.py
      - scripts/analytics_24h.py
      - scripts/tiktok_24h_snapshot.py
      - tests/test_tiktok_24h_empty_metrics.py
      - tests/test_tiktok_24h_malformed_rows.py
      - scripts/test_analytics_24h.py
      - tests/test_video_preflight.py
      - tests/test_video_preflight_malformed_metadata.py
      - tests/test_comedy_backlog.py
      - production/v6_comedy_idea_backlog.json
      - production/creative/**
      - .github/workflows/video-preflight.yml
jobs:
  test-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for MP4 regression fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Regression tests with real synthetic MP4 and invalid inputs
        run: python3 tests/test_video_preflight.py
      - name: Reject malformed FFprobe metadata safely
        run: python3 -m unittest discover -s tests -p 'test_video_preflight_malformed_metadata.py' -v
      - name: Perchance zero-cost handoff safety regression
        run: python3 tests/test_perchance_handoff.py
      - name: Creative backlog safety regression tests
        run: python3 tests/test_comedy_backlog.py
      - name: Publication safety and idempotency regression tests
        run: python3 scripts/test_publication_gate.py
      - name: Persistent 24-hour analytics regression tests
        run: python3 scripts/test_analytics_24h.py
      - name: TikTok 24h missing-metrics idempotency regression
        run: python3 -m unittest discover -s tests -p 'test_tiktok_24h_empty_metrics.py' -v
      - name: TikTok 24h malformed Metricool rows regression
        run: python3 -m unittest discover -s tests -p 'test_tiktok_24h_malformed_rows.py' -v
      - name: Verify inspection evidence exists and is valid JSON
        if: success()
        run: |
          test -s qa-output/preflight.json
          python3 -m json.tool qa-output/preflight.json > /dev/null
      - name: Save inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealradar-preflight-evidence
          path: qa-output/preflight.json
          if-no-files-found: error
          retention-days: 7
