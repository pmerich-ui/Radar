name: Awin approved merchants read-only check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-approved-merchants:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read publisher and joined programmes (no secrets in logs)
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          token = os.environ.get("AWIN_API_TOKEN", "").strip()
          if not token:
              print("BLOCKED: AWIN_API_TOKEN_MISSING")
              sys.exit(1)
          def get_json(url):
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
                  "User-Agent": "DealRadar-AwinReadOnly/1.0"}, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  print("BLOCKED: AWIN_HTTP_" + str(exc.code))
                  sys.exit(1)
              except Exception as exc:
                  print("BLOCKED: AWIN_REQUEST_" + type(exc).__name__)
                  sys.exit(1)
          accounts = get_json("https://api.awin.com/accounts?type=publisher")
          accounts = accounts.get("accounts", []) if isinstance(accounts, dict) else accounts
          if not isinstance(accounts, list):
              print("BLOCKED: UNEXPECTED_ACCOUNTS_RESPONSE")
              sys.exit(1)
          publishers = [a for a in accounts if isinstance(a, dict)
                        and a.get("accountType") == "publisher"
                        and str(a.get("accountId", "")).isdigit()]
          if len(publishers) != 1:
              print("BLOCKED: EXPECTED_EXACTLY_ONE_PUBLISHER; count=" + str(len(publishers)))
              sys.exit(1)
          publisher_id = str(publishers[0]["accountId"])
          # The relationship=joined filter is required: discoverable != approved.
          data = get_json("https://api.awin.com/publishers/" + publisher_id + "/programmes?relationship=joined")
          if isinstance(data, list):
              programmes = data
          elif isinstance(data, dict) and isinstance(data.get("programmes"), list):
              programmes = data["programmes"]
          else:
              print("BLOCKED: UNEXPECTED_PROGRAMMES_RESPONSE")
              sys.exit(1)
          if not all(isinstance(p, dict) for p in programmes):
              print("BLOCKED: INVALID_PROGRAMME_RECORDS")
              sys.exit(1)
          print("AWIN_JOINED_PROGRAMMES_QUERY_OK")
          print("Joined programme records:", len(programmes))
          print("PRODUCT_LINKS_NOT_VERIFIED; COMMISSIONS_NOT_VERIFIED; NO_PUBLICATION")
          PY
