name: DealRadar Three Daily Renders
on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dealradar-daily-renders
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Switzerland schedule
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import datetime, os
          from zoneinfo import ZoneInfo
          event = os.environ['EVENT_NAME']
          schedule = os.environ.get('SCHEDULE_EXPRESSION', '')
          if event == 'workflow_dispatch':
              enabled = True
              reason = 'manual dispatch'
          else:
              # Use the scheduled UTC slot, not the delayed runner start minute.
              # Paired UTC cron entries cover both CET and CEST.
              try:
                  utc_hour = int(schedule.split()[1])
                  assert schedule.startswith('0 ') and utc_hour in (7, 8, 12, 13, 18, 19)
                  # Only accept a recent scheduled slot. A delayed runner may start
                  # on the next UTC day; never silently reassign it to today's slot.
                  now_utc = datetime.datetime.now(datetime.timezone.utc)
                  candidates = [
                      datetime.datetime.combine(
                          now_utc.date() - datetime.timedelta(days=days_back),
                          datetime.time(utc_hour),
                          datetime.timezone.utc,
                      )
                      for days_back in (0, 1)
                  ]
                  valid = [
                      slot for slot in candidates
                      if 0 <= (now_utc - slot).total_seconds() <= 4 * 3600
                      and slot.astimezone(ZoneInfo('Europe/Zurich')).hour in (8, 13, 19)
                  ]
                  enabled = len(valid) == 1
                  reason = (
                      f'scheduled slot {valid[0].astimezone(ZoneInfo("Europe/Zurich")).isoformat()}'
                      if enabled else 'no unambiguous recent Swiss render slot'
                  )
              except (ValueError, IndexError, AssertionError) as exc:
                  enabled = False
                  reason = f'invalid schedule: {schedule!r} ({exc})'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('enabled=' + str(enabled).lower() + '\n')
          print(f'RENDER_GATE enabled={enabled} event={event} reason={reason}')
          PY
      - name: Install tools
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - name: Run tests
        if: steps.gate.outputs.enabled == 'true'
        run: python -m unittest discover -s tests -v
      - name: Inspect dual-channel publishing readiness (report only)
        if: steps.gate.outputs.enabled == 'true'
        run: python -m src.autopublish_readiness
      - name: Assert growth dry-run gate
        if: steps.gate.outputs.enabled == 'true'
        env:
          MODE: GROWTH
          DRY_RUN: 'true'
          PUBLISHING_ENABLED: 'false'
        run: |
          python - <<'PY'
          from src.publication_gate import publication_decision
          decision = publication_decision(qa_passed=True, rights_verified=True, factual_claims_verified=True, platform_tested=True, explicit_approval=True)
          print(decision)
          assert not decision['allowed'], 'Unsafe publication gate'
          PY
      - name: Render one video
        if: steps.gate.outputs.enabled == 'true'
        env:
          BATCH_SIZE: '1'
        run: python -m src.batch
      - name: Audit premium readiness (report only; never auto-publish)
        if: steps.gate.outputs.enabled == 'true'
        run: python -m src.readiness_audit
      - name: Store private render artifact
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dealradar-render-${{ github.run_id }}
          path: output/
          retention-days: 7
      - name: Save deduplication ledger
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name 'dealradar-video-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m src.save_ledger
