name: DealRadar Awin Feed Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * *'
permissions:
  contents: read
concurrency:
  group: dealradar-awin-feed-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
      DRY_RUN: 'true'
      PUBLISHING_ENABLED: 'false'
      MODE: GROWTH
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline security tests
        run: |
          python -m unittest discover -s tests -p 'test_awin_fetch.py' -v
          python -m unittest discover -s tests -p 'test_awin_preflight.py' -v
      - name: Check Awin credential configuration
        id: awin_preflight
        run: python -m src.awin_preflight
      - name: COO discover deal candidates and Agent 14 draft briefs (redacted summary)
        if: steps.awin_preflight.outputs.ready == 'true'
        run: python -m src.coo_deal_pipeline
      - name: Fail clearly when Awin feed access is blocked
        if: steps.awin_preflight.outputs.ready != 'true'
        run: |
          echo '::error title=Awin feed blocked::Awin feed secret missing or invalid. See Awin preflight summary; no offers were imported.'
          exit 2
      - name: Upload audit summary only (never upload feed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awin-audit-summary
          path: |
            reports/awin_feed_status.json
            reports/awin_preflight.json
            reports/coo_deal_pipeline.json
          if-no-files-found: ignore
          retention-days: 7
