name: DealRadar Independent Image Drafts
on:
  pull_request:
    paths:
      - 'src/image_drafts.py'
      - '.github/workflows/image-drafts.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: read
concurrency:
  group: image-drafts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r requirements.txt
          python -m src.image_drafts
      - run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p = Path('output/images')
          rows = json.loads((p/'report.json').read_text())['drafts']
          assert len(rows) == 5
          assert len({r['sha256'] for r in rows}) == 5
          for r in rows:
              assert not r['publishable']
              assert hashlib.sha256((p/r['file']).read_bytes()).hexdigest() == r['sha256']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-image-drafts
          path: output/images/
          if-no-files-found: error
          retention-days: 7
